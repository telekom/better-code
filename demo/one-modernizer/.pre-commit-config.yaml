repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [check]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-r, hooks, skills, -ll]
        pass_filenames: false

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--ignore, node_modules]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest hooks/scripts/tests/ -v
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

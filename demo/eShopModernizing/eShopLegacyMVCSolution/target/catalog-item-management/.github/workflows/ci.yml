name: catalog-service CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore eShopModernized.Catalog.sln

      - name: Build
        run: dotnet build eShopModernized.Catalog.sln -c Release --no-restore

      - name: Test
        run: dotnet test eShopModernized.Catalog.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -f eShopModernized.Catalog/Dockerfile -t eshop-catalog:${{ github.sha }} .
